# Curation for the generated registry.json.
#
# The manifests under manifests/ describe published files: paths, checksums,
# sizes, regions, variants, backends. They carry nothing about presentation,
# because that is the consumer's business. This file supplies the rest: display
# name, description, vendor, licence, model type, and which variant to install
# when nothing better is known.
#
# Regenerate after editing:
#   cargo run --features gen-registry --bin gen-registry
#
# Single-file entries not listed here are carried through from the existing
# registry.json untouched, which is how the frozen legacy entries survive
# regeneration. A variant-based entry belongs to the generator: removing its
# [[model]] removes it from registry.json.
#
# An entry's `regions` file is either flat (country names and its own group
# order) or wrapped (ISO 3166-1 alpha-2 codes, no group order). A wrapped file
# needs `groups`, the family's groups.json under manifests/, which supplies each
# tile's group and the order the groups are shown in; a flat file must not have
# it. Codes become English names through manifests/iso3166-1-alpha2.json, which
# is shared by every entry.

schema_version = "2.0"
# registry_version is not set here: the generator (gen-registry) manages it,
# bumping it by one on every content change. The loader replaces a user's cached
# registry only when the bundled version is higher, so an automatic bump is what
# makes a corrected checksum or class count reach everyone who already has a
# cache, instead of a manual step that is easy to forget.

[[model]]
id = "birdnet-plus-v30"
manifest = "BirdNET-Plus-V3.0.models.json"
regions = "BirdNET-Plus-V3.0.regions.json"
groups = "BirdNET-Plus-V3.0.groups.json"
name = "BirdNET+ V3.0"
description = "11,725 classes worldwide: birds, other wildlife and 16 sound classes. 5 second window at 32 kHz"
vendor = "Cornell Lab of Ornithology & Chemnitz University of Technology"
model_type = "birdnet-v30"
recommended = false
# The only precision published.
default_variant = "fp32"

# Apache-2.0, per LICENSE-v3.0.1.md in the model repository. The acceptable
# use policy is a document in the manifest's family_meta, carried into the
# registry by gen-registry, so it is not restated here.
[model.license]
type = "Apache-2.0"
url = "https://www.apache.org/licenses/LICENSE-2.0"
commercial_use = true
attribution_required = true
share_alike = false

[[model]]
id = "perch-v2"
manifest = "Perch-v2-Models.models.json"
regions = "Perch-v2-Models.regions.json"
groups = "Perch-v2-Models.groups.json"
name = "Google Perch v2"
description = "General bird sound classification model"
vendor = "Google Research"
model_type = "perch-v2"
recommended = false
# The Perch export with the in-graph DFT removed. The plain fp32 file keeps an
# STFT op that OpenVINO cannot translate, so it is not a safe default.
default_variant = "no-dft-fp32"

[model.license]
type = "Apache-2.0"
url = "https://www.apache.org/licenses/LICENSE-2.0"
commercial_use = true
attribution_required = true
share_alike = false
